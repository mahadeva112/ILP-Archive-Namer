<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Paste First Mockup</title>
<!-- Static design mockup: a different take on the Create screen. The link is
     the first and biggest thing; the name sits on top, live; every date opens
     a centered calendar dialog, so nothing ever opens below the fold.
     Uses the real styles.css for tokens and shared parts. Not served. -->
<link rel="stylesheet" href="styles.css">
<style>
.wrap { padding: 20px 24px 110px; max-width: 1500px; }

/* --------------------------------------------------------- category tabs */
.cats { display: flex; gap: 6px; overflow-x: auto; margin-bottom: 16px; scrollbar-width: none; }
.cats::-webkit-scrollbar { display: none; }
.cats button {
  flex: 0 0 auto; display: flex; align-items: center; gap: 7px;
  padding: 7px 12px; border-radius: 10px; cursor: pointer;
  background: var(--surface); border: 1px solid var(--line); color: var(--text-2);
  font: inherit; font-size: 12px; font-weight: 600; transition: .13s;
}
.cats button b { font-family: var(--mono); font-size: 10.5px; color: var(--text-3); font-weight: 600; }
.cats button:hover { border-color: var(--accent-ln); color: var(--text); }
.cats button.on { background: var(--accent-bg); border-color: var(--accent-ln); color: var(--accent); }
.cats button.on b { color: var(--accent); }

/* ------------------------------------------------------------------ hero */
.hero {
  display: grid; grid-template-columns: minmax(0, 1fr) auto; gap: 18px; align-items: center;
  padding: 20px 22px; border-radius: 16px; margin-bottom: 16px;
  background: var(--surface); border: 1px solid var(--line);
  position: relative; overflow: hidden;
}
.hero::before {
  content: ''; position: absolute; inset: 0 auto 0 0; width: 4px; background: var(--accent);
}
.hero .eyebrow { margin-bottom: 8px; display: flex; align-items: center; gap: 8px; }
.hero .eyebrow .stepno {
  width: 18px; height: 18px; border-radius: 50%; display: grid; place-items: center;
  background: var(--accent); color: #fff; font-size: 10px; letter-spacing: 0;
}
.linkbox {
  display: flex; align-items: center; gap: 10px;
  background: var(--bg); border: 1.5px solid var(--line); border-radius: 12px;
  padding: 4px 4px 4px 14px; transition: border-color .13s, box-shadow .13s;
}
[data-theme="light"] .linkbox { background: var(--surface-2); }
.linkbox:focus-within { border-color: var(--accent); box-shadow: var(--ring); }
.linkbox.ok { border-color: var(--ok-ln); }
.linkbox svg { width: 18px; height: 18px; color: var(--text-3); flex: 0 0 auto; }
.linkbox.ok svg { color: var(--ok); }
.linkbox input {
  border: 0; background: none; box-shadow: none; padding: 11px 0;
  font-family: var(--mono); font-size: 14px;
}
.linkbox input:focus { box-shadow: none; }
.linkbox button { flex: 0 0 auto; padding: 10px 16px; }
.linkhint { font-size: 11.5px; color: var(--text-3); margin-top: 8px; min-height: 18px; }
.linkhint.ok { color: var(--ok); }
.linkhint.bad { color: var(--bad); }
.linkhint code { font-family: var(--mono); }

.ring { position: relative; width: 74px; height: 74px; }
.ring svg { width: 74px; height: 74px; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 7; }
.ring .bg { stroke: var(--surface-3); }
.ring .fg { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .5s; }
.ring.done .fg { stroke: var(--ok); }
.ring span {
  position: absolute; inset: 0; display: grid; place-items: center;
  font-family: var(--mono); font-size: 15px; font-weight: 600;
}
.ring small { display: block; text-align: center; font-size: 10px; color: var(--text-3); margin-top: 5px; }

/* -------------------------------------------------------------- name rail */
.namecard { margin-bottom: 16px; }
.name-rail { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 3px; }
.part {
  display: flex; flex-direction: column; align-items: center; gap: 7px;
  background: none; border: 0; cursor: pointer; font: inherit; color: inherit; padding: 0;
}
.part .tok {
  font-family: var(--mono); font-size: 17px; font-weight: 600; white-space: nowrap;
  padding: 7px 10px; border-radius: 9px; border: 1px solid transparent; transition: .15s;
}
.part .cap {
  font-size: 9.5px; font-weight: 700; letter-spacing: .07em; text-transform: uppercase;
  color: var(--text-3); display: flex; align-items: center; gap: 4px;
}
.part .cap svg { width: 10px; height: 10px; opacity: 0; transition: opacity .15s; }
.part:hover .cap svg { opacity: 1; }
.part:hover .tok { filter: brightness(1.15); }
.part.c0 .tok { color: var(--accent);   background: var(--accent-bg); border-color: var(--accent-ln); }
.part.c1 .tok { color: var(--accent-2); background: var(--sand-bg);   border-color: var(--sand-ln); }
.part.c2 .tok { color: var(--ok);       background: var(--ok-bg);     border-color: var(--ok-ln); }
.part.c3 .tok { color: var(--info);     background: var(--info-bg);   border-color: var(--info-ln); }
.part.todo .tok { color: var(--text-3); border: 1px dashed var(--text-3); font-weight: 500; opacity: .75; }
.part.loading .tok {
  color: transparent; min-width: 170px; border-color: var(--line);
  background: linear-gradient(90deg, var(--surface-2), var(--surface-3), var(--surface-2));
  background-size: 200% 100%; animation: shimmer 1.1s linear infinite;
}
.part.pop .tok { animation: pop .35s cubic-bezier(.2, .9, .3, 1.4); }
.sep { font-family: var(--mono); font-size: 17px; color: var(--text-3); padding: 7px 1px; }
@keyframes shimmer { to { background-position: -200% 0; } }
@keyframes pop { from { transform: scale(.85); opacity: 0; } }
.name-foot { display: flex; align-items: center; gap: 10px; margin-top: 14px; font-size: 12px; color: var(--text-3); flex-wrap: wrap; }
.name-foot .nas { flex: 1; min-width: 260px; padding: 8px 11px; font-size: 11.5px; }

/* ------------------------------------------------------------- bottom grid */
.grid { display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr); gap: 16px; align-items: stretch; }
@media (max-width: 1080px) { .grid, .hero { grid-template-columns: 1fr; } }
.grid > .card { display: flex; flex-direction: column; margin: 0; }
.fields { display: grid; grid-template-columns: 1fr 1fr; gap: 0 14px; }
.fields .wide { grid-column: 1 / -1; }

/* date field (opens the dialog) */
.datefield {
  width: 100%; display: flex; align-items: center; gap: 11px; cursor: pointer;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
  padding: 6px 10px 6px 7px; text-align: left; font: inherit; color: var(--text);
  transition: border-color .13s, box-shadow .13s;
}
.datefield:hover { border-color: var(--accent-ln); }
.datefield:focus-visible { outline: none; border-color: var(--accent); box-shadow: var(--ring); }
.datefield .ic {
  width: 32px; height: 32px; border-radius: 8px; flex: 0 0 auto;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  background: var(--accent-bg); color: var(--accent); border: 1px solid var(--accent-ln);
  font-family: var(--mono); line-height: 1;
}
.datefield .ic .m { font-size: 7.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; }
.datefield .ic .d { font-size: 13px; font-weight: 600; margin-top: 2px; }
.datefield .v { font-family: var(--mono); font-size: 13.5px; font-weight: 500; }
.datefield .s { font-size: 11px; color: var(--text-3); }
.datefield .s b { color: var(--text-2); font-weight: 600; }
.datefield .open-ic { margin-left: auto; width: 15px; height: 15px; color: var(--text-3); }

/* file preview */
.preview { flex: 1; position: relative; min-height: 240px; }
.preview-in { position: absolute; inset: 0; overflow-y: auto; }
.tree-row {
  display: flex; align-items: center; gap: 8px; padding: 6px 8px; border-radius: 7px;
  font-family: var(--mono); font-size: 11.5px; color: var(--text-2);
}
.tree-row:hover { background: var(--surface-2); }
.tree-row svg { width: 14px; height: 14px; flex: 0 0 auto; }
.tree-row.folder { color: var(--text); font-weight: 600; }
.tree-row.folder svg { color: var(--warn); }
.tree-row.file svg { color: var(--text-3); }
.tree-row.file .n { color: var(--ok); word-break: break-all; }
.tree-row .tag { margin-left: auto; flex: 0 0 auto; }
.tree-row .file-tag { font-size: 9px; padding: 2px 6px; }
.tree-row.root { color: var(--accent); }
.tree-row.root svg { color: var(--accent); }
.tree-row.ghosty .n { color: var(--text-3); }
.indent1 { padding-left: 26px; }
.indent2 { padding-left: 46px; }
.skel { height: 9px; border-radius: 5px; background: var(--surface-3); flex: 1; max-width: 240px; opacity: .8; }

/* ================================================================ dialog
   Centered in the window, so it is always fully visible whatever the scroll
   position or the field's place on the page. */
.scrim {
  position: fixed; inset: 0; z-index: 80; display: grid; place-items: center;
  background: rgba(8, 6, 5, .62); padding: 16px;
  animation: fade .15s ease;
}
[data-theme="light"] .scrim { background: rgba(60, 40, 25, .28); }
@keyframes fade { from { opacity: 0; } }
.dlg {
  width: 640px; max-width: 100%; max-height: calc(100vh - 32px); overflow: auto;
  display: grid; grid-template-columns: 220px minmax(0, 1fr);
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
  box-shadow: var(--shadow-2); animation: rise .2s cubic-bezier(.2, .8, .3, 1);
}
@keyframes rise { from { opacity: 0; transform: translateY(10px) scale(.98); } }
@media (max-width: 640px) { .dlg { grid-template-columns: 1fr; } }

.dlg-side {
  padding: 20px 18px; border-right: 1px solid var(--line);
  background: var(--surface-2); border-radius: 18px 0 0 18px;
  display: flex; flex-direction: column; gap: 14px;
}
.dlg-side .lbl { font-size: 10.5px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); }
.big-date .d { font-family: var(--mono); font-size: 40px; font-weight: 600; line-height: 1; color: var(--accent); }
.big-date .my { font-family: var(--mono); font-size: 15px; margin-top: 6px; }
.big-date .wd { font-size: 12px; color: var(--text-3); margin-top: 3px; }
.dlg-side .as {
  font-size: 11px; color: var(--text-3); line-height: 1.5;
}
.dlg-side .as code {
  display: inline-block; margin-top: 4px; font-family: var(--mono); font-size: 12px; color: var(--accent);
  background: var(--accent-bg); border: 1px solid var(--accent-ln); padding: 3px 8px; border-radius: 6px;
}
.quick { display: flex; flex-direction: column; gap: 4px; margin-top: auto; }
.quick button {
  text-align: left; padding: 7px 10px; border-radius: 8px; cursor: pointer;
  background: none; border: 1px solid transparent; color: var(--text-2); font: inherit; font-size: 12px;
  display: flex; justify-content: space-between;
}
.quick button span { font-family: var(--mono); font-size: 11px; color: var(--text-3); }
.quick button:hover { background: var(--surface); border-color: var(--line); color: var(--text); }
.quick button.on { background: var(--accent-bg); border-color: var(--accent-ln); color: var(--accent); }

.dlg-main { padding: 16px 18px 18px; display: flex; flex-direction: column; }
.dlg-top { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
.dlg-top h3 { font-size: 13.5px; font-weight: 650; flex: 1; }
.typein {
  display: flex; align-items: center; gap: 8px; padding: 0 10px; margin-bottom: 4px;
  background: var(--surface-2); border: 1px solid var(--line); border-radius: 9px;
}
.typein:focus-within { border-color: var(--accent); box-shadow: var(--ring); }
.typein svg { width: 15px; height: 15px; color: var(--text-3); }
.typein input { border: 0; background: none; padding: 8px 0; font-family: var(--mono); font-size: 12.5px; }
.typein input:focus { box-shadow: none; }
.typein input::placeholder { font-family: var(--sans); font-size: 12px; }
.parse { font-size: 11px; min-height: 16px; margin: 2px 2px 8px; color: var(--text-3); }
.parse.ok { color: var(--ok); } .parse.bad { color: var(--bad); }
.parse code { font-family: var(--mono); }

.cal-hd { display: flex; align-items: center; gap: 4px; margin-bottom: 4px; }
.cal-hd .t { flex: 1; display: flex; gap: 2px; }
.cal-hd .t button {
  display: flex; align-items: center; gap: 4px; padding: 5px 8px; border-radius: 7px;
  background: none; border: 0; color: var(--text); cursor: pointer; font: inherit; font-size: 14px; font-weight: 650;
}
.cal-hd .t button.yr { font-family: var(--mono); font-weight: 500; color: var(--text-2); }
.cal-hd .t button:hover { background: var(--surface-2); color: var(--accent); }
.cal-hd .t button.on { background: var(--accent-bg); color: var(--accent); }
.cal-hd .t svg { width: 11px; height: 11px; }
.calnav {
  width: 30px; height: 30px; border-radius: 8px; display: grid; place-items: center; cursor: pointer;
  background: none; border: 1px solid transparent; color: var(--text-2); padding: 0;
}
.calnav svg { width: 16px; height: 16px; }
.calnav:hover:not(:disabled) { background: var(--surface-2); border-color: var(--line); color: var(--accent); }
.calnav:disabled { opacity: .3; cursor: default; }
.cal-body:focus { outline: none; }
.dow, .days { display: grid; grid-template-columns: repeat(7, 1fr); }
.dow span { text-align: center; font-size: 10px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--text-3); padding: 6px 0; }
.dow span:first-child { color: var(--accent-2); }
.days { gap: 2px; }
.day {
  position: relative; height: 38px; border-radius: 9px; border: 0; background: none; cursor: pointer;
  color: var(--text); font: inherit; font-size: 13px; font-variant-numeric: tabular-nums;
}
.day:hover:not(:disabled) { background: var(--surface-3); }
.day.sun { color: var(--accent-2); }
.day.other { color: var(--text-3); opacity: .55; }
.day.today { font-weight: 700; color: var(--accent); }
.day.today::after { content: ''; position: absolute; left: 50%; bottom: 5px; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--accent); }
.day.cursor { box-shadow: inset 0 0 0 1.5px var(--accent-ln); }
.cal-body:focus-visible .day.cursor { box-shadow: inset 0 0 0 2px var(--accent); }
.day.sel, .day.sel:hover { background: var(--accent); color: #fff; font-weight: 700; opacity: 1; }
.day.sel::after { background: #fff; }
.day:disabled { opacity: .25; cursor: not-allowed; text-decoration: line-through; }
.g12 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 6px; padding: 4px 0; }
.cell {
  height: 54px; border-radius: 10px; cursor: pointer; font: inherit; font-size: 13px; font-weight: 600;
  background: var(--surface-2); border: 1px solid var(--line-soft); color: var(--text-2);
}
.cell.yr { font-family: var(--mono); font-weight: 500; }
.cell:hover:not(:disabled) { border-color: var(--accent-ln); color: var(--accent); }
.cell.now { color: var(--accent); border-color: var(--accent-ln); }
.cell.sel { background: var(--accent); border-color: var(--accent); color: #fff; }
.cell:disabled { opacity: .3; cursor: not-allowed; }
.sl { animation: sl .2s ease; } .sr { animation: sr .2s ease; } .zm { animation: zm .18s ease; }
@keyframes sl { from { opacity: 0; transform: translateX(18px); } }
@keyframes sr { from { opacity: 0; transform: translateX(-18px); } }
@keyframes zm { from { opacity: 0; transform: scale(.96); } }
.dlg-ft { display: flex; align-items: center; gap: 8px; margin-top: 14px; padding-top: 12px; border-top: 1px solid var(--line-soft); }
.dlg-ft .keys { font-size: 11px; color: var(--text-3); flex: 1; }
.dlg-ft .keys .kbd { margin: 0 2px; }
</style>
</head>
<body>

<div class="app">
  <aside class="rail">
    <div class="brand">
      <svg class="logo" viewBox="0 0 48 48" aria-hidden="true">
        <rect width="48" height="48" rx="12" fill="#d9825f"/>
        <rect x="10" y="18.6" width="28" height="16.4" rx="3" fill="#fff"/>
        <path d="M21.7 23.1 29.3 26.8 21.7 30.5z" fill="#c05f3f"/>
      </svg>
      <div><h1>Archive Namer</h1><p>ILP &middot; Isha Archives</p></div>
    </div>
    <nav class="nav">
      <div class="nav-label">Workflow</div>
      <button class="on"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>Create a name <span class="kbd">1</span></button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>Folder &amp; files <span class="kbd">2</span></button>
      <button><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>Check a name <span class="kbd">3</span></button>
    </nav>
  </aside>

  <div class="main">
    <header class="top">
      <div class="crumb">Create a name <span>&middot; paste-first layout (mockup)</span></div>
      <div class="live empty" id="liveBar"><span class="dot"></span><code id="liveName">No name yet</code></div>
    </header>

    <div class="wrap">

      <!-- category, as a compact strip instead of a big grid -->
      <div class="cats" id="cats">
        <button class="on"><b>#1</b>Dubbed YouTube</button>
        <button><b>#2</b>Other official channel</button>
        <button><b>#3</b>Unlisted original</button>
        <button><b>#4</b>Department request</button>
        <button><b>#5</b>Sadhguru Exclusive</button>
        <button><b>#6</b>Instagram reel</button>
        <button><b>#7</b>Satsang audio</button>
        <button><b>backup</b>Department backup</button>
      </div>

      <!-- the one thing to do first -->
      <div class="hero">
        <div>
          <div class="eyebrow"><span class="stepno">1</span>Start with the English video link</div>
          <div class="linkbox" id="linkbox">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M10 14a4 4 0 0 0 5.66 0l3-3a4 4 0 0 0-5.66-5.66l-1 1"/><path d="M14 10a4 4 0 0 0-5.66 0l-3 3a4 4 0 0 0 5.66 5.66l1-1"/></svg>
            <input id="url" placeholder="https://youtu.be/...  or a bare 11-character code" autocomplete="off" spellcheck="false">
            <button class="primary" id="btnPaste">Paste link</button>
          </div>
          <div class="linkhint" id="linkhint">The video code and the English title are read from the link.</div>
        </div>
        <div>
          <div class="ring" id="ring">
            <svg viewBox="0 0 74 74"><circle class="bg" cx="37" cy="37" r="31"/><circle class="fg" id="ringFg" cx="37" cy="37" r="31" stroke-dasharray="194.8" stroke-dashoffset="97"/></svg>
            <span id="ringTxt">2/4</span>
          </div>
          <small style="display:block;text-align:center;font-size:10px;color:var(--text-3);margin-top:5px">parts ready</small>
        </div>
      </div>

      <!-- the name, live, full width -->
      <div class="card namecard">
        <div class="copybar">
          <div class="section-title">Folder name</div>
          <div class="spacer"></div>
          <span style="font-size:11px;color:var(--text-3)">Click any part to change it</span>
          <button class="copy">Copy</button>
        </div>
        <div class="name-rail" id="rail"></div>
        <div class="name-foot" id="nameFoot"></div>
      </div>

      <!-- details and what will be made, side by side, equal height -->
      <div class="grid">
        <div class="card">
          <div class="copybar"><div class="section-title"><span style="color:var(--accent)">2</span> &nbsp;Check the details</div></div>
          <div class="fields">
            <div class="field">
              <label>Channel <span class="req">*</span></label>
              <select><option>SGYT - Sadhguru YT Channel</option></select>
            </div>
            <div class="field">
              <label>Language <span class="req">*</span></label>
              <select><option>Hindi - hin</option></select>
            </div>
            <div class="field wide">
              <label>Video title in English <span class="req">*</span></label>
              <input id="title" autocomplete="off" placeholder="Filled from the link">
              <div class="hint" id="slugHint"></div>
            </div>
            <div class="field">
              <label>Date created <span class="req">*</span></label>
              <button type="button" class="datefield" id="dateBtn"></button>
            </div>
            <div class="field">
              <label>Voice tracks</label>
              <div class="stepper-row">
                <div class="stepper"><button type="button" id="vMinus">&minus;</button><input type="number" id="voices" value="2" min="1" max="12"><button type="button" id="vPlus">+</button></div>
              </div>
            </div>
          </div>
          <div class="checkline" style="margin-top:auto;padding-top:6px">
            <input type="checkbox" id="ftc"><label for="ftc" style="text-transform:none;letter-spacing:0;margin:0;font-size:12px">Force Title Case (fold acronyms like USA to Usa)</label>
          </div>
        </div>

        <div class="card">
          <div class="copybar">
            <div class="section-title" id="filesTitle">What will be made</div>
            <div class="spacer"></div>
            <button class="copy">Copy tree</button>
          </div>
          <div class="preview"><div class="preview-in" id="tree"></div></div>
        </div>
      </div>
    </div>

    <div class="actionbar">
      <div class="sum" id="sum"></div>
      <div class="spacer"></div>
      <button class="ghost" id="btnClear">Clear</button>
      <button class="ghost">Copy name</button>
      <button class="primary" id="btnDisk" disabled>Create on disk</button>
    </div>
  </div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const SAMPLE_URL = 'https://youtu.be/dQw4w9WgXcQ';
const SAMPLE_TITLE = 'A Lesson From Guru Nanak';
const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
const MONTH = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
const WD = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
const ICON = {
  folder: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v9a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
  file: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M14 3H6a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V9z"/><path d="M14 3v6h6"/></svg>',
  pen: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M4 20h4L19 9l-4-4L4 16z"/></svg>',
  cal: '<svg class="open-ic" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
  down: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m6 9 6 6 6-6"/></svg>',
  left: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>',
  right: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg>',
  kb: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="2" y="5" width="20" height="14" rx="2"/><path d="M6 9h.01M10 9h.01M14 9h.01M18 9h.01M7 15h10"/></svg>',
};

/* ------------------------------------------------------------ dates */
const pad = (n) => String(n).padStart(2, '0');
const mk = (y, m, d) => new Date(y, m, d);
const TODAY = (() => { const t = new Date(); return mk(t.getFullYear(), t.getMonth(), t.getDate()); })();
const fmt = (d) => pad(d.getDate()) + '-' + MON[d.getMonth()] + '-' + d.getFullYear();
const same = (a, b) => a && b && a.getTime() === b.getTime();
const addDays = (d, n) => mk(d.getFullYear(), d.getMonth(), d.getDate() + n);
const addMonths = (d, n) => {
  const f = mk(d.getFullYear(), d.getMonth() + n, 1);
  return mk(f.getFullYear(), f.getMonth(), Math.min(d.getDate(), mk(f.getFullYear(), f.getMonth() + 1, 0).getDate()));
};
const past = (d) => (d > TODAY ? TODAY : d);
function ago(d) {
  const n = Math.round((TODAY - d) / 864e5);
  if (n === 0) return 'Today';
  if (n === 1) return 'Yesterday';
  if (n < 14) return n + ' days ago';
  if (n < 60) return Math.round(n / 7) + ' weeks ago';
  if (n < 730) return Math.round(n / 30.44) + ' months ago';
  return Math.floor(n / 365.25) + ' years ago';
}
function parse(raw) {
  const s = raw.trim().toLowerCase().replace(/\s+/g, ' ');
  if (!s) return null;
  if (s === 'today') return TODAY;
  if (s === 'yesterday') return addDays(TODAY, -1);
  let y, m, d, x;
  if ((x = s.match(/^(\d{4})[-/.](\d{1,2})[-/.](\d{1,2})$/))) [y, m, d] = [+x[1], +x[2], +x[3]];
  else if ((x = s.match(/^(\d{1,2})[-/. ](\d{1,2})[-/. ](\d{2}|\d{4})$/))) [d, m, y] = [+x[1], +x[2], +x[3]];
  else if ((x = s.match(/^(\d{1,2})[-/. ]?([a-z]{3,9})[-/., ]*(\d{2}|\d{4})$/))) {
    const i = MON.findIndex((n) => x[2].startsWith(n.toLowerCase()));
    if (i < 0) return null;
    [d, m, y] = [+x[1], i + 1, +x[3]];
  } else return null;
  if (y < 100) y += 2000;
  const r = mk(y, m - 1, d);
  return r.getMonth() === m - 1 && r.getDate() === d ? r : null;
}

/* ------------------------------------------------------------ state */
const S = { code: '', title: '', loading: false, date: TODAY, voices: 2 };
let lookupTimer = null;

const slug = (t) => t.trim().replace(/[^A-Za-z0-9 ]+/g, '').split(/\s+/).filter(Boolean)
  .map((w) => w[0].toUpperCase() + w.slice(1)).join('-');
const codeFrom = (raw) => {
  const s = raw.trim();
  const m = s.match(/(?:youtu\.be\/|v=|shorts\/|embed\/)([A-Za-z0-9_-]{11})/) || s.match(/^([A-Za-z0-9_-]{11})$/);
  return m ? m[1] : '';
};

function render(popKey) {
  const t = slug(S.title);
  const parts = [
    { key: 'ch', text: 'SGYThin', cap: 'channel + lang', ok: true, go: () => document.querySelector('select').focus() },
    { key: 'code', text: S.code || 'video code', cap: S.code ? 'video code' : 'from the link', ok: !!S.code, go: () => $('url').focus() },
    { key: 'title', text: t || 'Title', cap: t ? 'title' : S.loading ? 'fetching title' : 'from the link', ok: !!t, loading: S.loading && !t, go: () => $('title').focus() },
    { key: 'date', text: fmt(S.date), cap: 'created', ok: true, go: () => openCal() },
  ];
  $('rail').innerHTML = parts.map((p, i) => (i ? '<span class="sep">_</span>' : '')
    + '<button type="button" class="part ' + (p.loading ? 'loading' : p.ok ? 'c' + i : 'todo') + (p.key === popKey ? ' pop' : '')
    + '" data-i="' + i + '"><span class="tok">' + p.text + '</span><span class="cap">' + ICON.pen + p.cap + '</span></button>').join('');
  $('rail').querySelectorAll('.part').forEach((b) => { b.onclick = parts[+b.dataset.i].go; });

  const ready = parts.filter((p) => p.ok).length;
  const done = ready === 4;
  const name = 'SGYThin_' + S.code + '_' + t + '_' + fmt(S.date);
  $('ringFg').style.strokeDashoffset = 194.8 * (1 - ready / 4);
  $('ringTxt').textContent = ready + '/4';
  $('ring').classList.toggle('done', done);
  $('linkbox').classList.toggle('ok', !!S.code);

  $('nameFoot').innerHTML = done
    ? '<span class="pill ok">Spec compliant</span><span>Passes every rule</span>'
      + '<div class="nas">' + ICON.folder + 'ILP NAS Drive/video-edit-tr-priv1/' + name + '</div>'
    : '<span class="pill" style="background:var(--surface-2);border:1px solid var(--line);color:var(--text-3)">Not ready</span>'
      + '<span>Waiting for ' + parts.filter((p) => !p.ok).map((p) => p.key === 'code' ? 'the video code' : 'the title').join(' and ') + '</span>';

  $('slugHint').innerHTML = t ? 'Becomes <code>' + t + '</code>' : '';
  renderTree(t, done);
  paintDate();

  $('liveBar').classList.toggle('empty', !done);
  $('liveName').textContent = done ? name : 'No name yet';
  $('sum').innerHTML = done ? 'Ready &middot; <b>1 folder</b>, 7 subfolders, ' + (4 + S.voices) + ' filenames'
    : '<b>' + ready + ' of 4</b> parts ready &middot; paste the link to continue';
  $('btnDisk').disabled = !done;
}

function renderTree(t, done) {
  const name = t || '…';
  const v = Array.from({ length: S.voices }, (_, i) => ['Voice' + (i + 1) + '_' + name + '_hin.wav', 0]);
  const groups = [
    ['Video Output', [['Output_' + name + '_hin.mp4', 1], ['FB-Output_' + name + '_hin.mp4', 0]]],
    ['Audio Output', v],
    ['SRT_Transcript', [['Script_' + name + '_hin.docx', 0], ['Subtitles_' + name + '_hin.srt', 0]]],
    ['Audio Project', []], ['Video Project', []], ['Common files', []], ['Fonts', []],
  ];
  const files = groups.reduce((a, g) => a + g[1].length, 0);
  $('filesTitle').textContent = 'What will be made · ' + files + ' files';
  let h = '<div class="tree-row folder root">' + ICON.folder + '<span class="n">'
    + (done ? 'SGYThin_' + S.code + '_' + t + '_' + fmt(S.date) : 'Your folder') + '/</span></div>';
  groups.forEach(([g, fs]) => {
    h += '<div class="tree-row folder indent1">' + ICON.folder + g + '/' + (fs.length ? '' : '<span class="tag" style="font-weight:400;color:var(--text-3);font-size:10.5px">empty</span>') + '</div>';
    fs.forEach(([f, must]) => {
      h += '<div class="tree-row file indent2' + (t ? '' : ' ghosty') + '">' + ICON.file
        + (t ? '<span class="n">' + f + '</span>' : '<span class="skel"></span>')
        + '<span class="tag"><span class="file-tag ' + (must ? 'must' : 'opt') + '">' + (must ? 'required' : 'optional') + '</span></span></div>';
    });
  });
  $('tree').innerHTML = h;
}

function paintDate() {
  const d = S.date;
  $('dateBtn').innerHTML = '<span class="ic"><span class="m">' + MON[d.getMonth()] + '</span><span class="d">' + d.getDate() + '</span></span>'
    + '<span><div class="v">' + fmt(d) + '</div><div class="s"><b>' + WD[d.getDay()] + '</b> &middot; ' + ago(d) + '</div></span>' + ICON.cal;
}

/* ------------------------------------------------------------ link flow */
function onUrl() {
  const raw = $('url').value;
  const code = codeFrom(raw);
  const changed = code !== S.code;
  S.code = code;
  const hint = $('linkhint');
  if (!raw.trim()) { hint.className = 'linkhint'; hint.textContent = 'The video code and the English title are read from the link.'; }
  else if (!code) { hint.className = 'linkhint bad'; hint.innerHTML = 'No video code found yet. A YouTube link or an 11-character code works.'; }
  else { hint.className = 'linkhint ok'; hint.innerHTML = '✓ Video code <code>' + code + '</code>' + (S.title ? '' : ' &middot; fetching the title…'); }
  if (changed) clearTimeout(lookupTimer);
  if (code && changed && !S.title) {
    S.loading = true;
    lookupTimer = setTimeout(() => {
      S.loading = false; S.title = SAMPLE_TITLE; $('title').value = SAMPLE_TITLE;
      hint.innerHTML = '✓ Video code <code>' + S.code + '</code> &middot; title found';
      render('title');
    }, 1200);
  }
  if (!code) S.loading = false;
  render(changed && code ? 'code' : null);
}
$('url').addEventListener('input', onUrl);
$('title').addEventListener('input', () => { S.title = $('title').value; S.loading = false; render(); });
$('btnPaste').onclick = async () => {
  let text = '';
  try { text = await navigator.clipboard.readText(); } catch (e) { /* no clipboard permission */ }
  $('url').value = codeFrom(text) ? text : SAMPLE_URL;
  onUrl();
};
$('btnClear').onclick = () => {
  clearTimeout(lookupTimer);
  Object.assign(S, { code: '', title: '', loading: false, date: TODAY });
  $('url').value = ''; $('title').value = ''; onUrl();
};
const setVoices = (n) => { S.voices = Math.max(1, Math.min(12, n)); $('voices').value = S.voices; render(); };
$('vMinus').onclick = () => setVoices(S.voices - 1);
$('vPlus').onclick = () => setVoices(S.voices + 1);
$('voices').oninput = () => setVoices(+$('voices').value || 1);
$('dateBtn').onclick = () => openCal();

/* ================================================================ calendar
   A centered dialog: never below the fold, never needs a scroll. The pick is
   held until "Use this date", so browsing months changes nothing. */
let C = null;     // { pick, cursor, view, back }

function openCal() {
  C = { pick: S.date, cursor: S.date, view: 'days', back: document.activeElement };
  const scrim = document.createElement('div');
  scrim.className = 'scrim';
  scrim.id = 'scrim';
  scrim.innerHTML =
    '<div class="dlg" role="dialog" aria-modal="true" aria-label="Pick a date">'
    + '<div class="dlg-side">'
    +   '<div class="lbl">Selected</div>'
    +   '<div class="big-date" id="bigDate"></div>'
    +   '<div class="as" id="asName"></div>'
    +   '<div class="quick" id="quick">'
    +     '<button data-q="0">Today</button><button data-q="-1">Yesterday</button>'
    +     '<button data-q="-7">1 week ago</button><button data-q="-30">1 month ago</button>'
    +   '</div>'
    + '</div>'
    + '<div class="dlg-main">'
    +   '<div class="dlg-top"><h3>Date translated video was created</h3>'
    +     '<button class="icon-btn" id="calX" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></div>'
    +   '<div class="typein">' + ICON.kb + '<input id="calType" placeholder="Type a date: 12/3/21, 12 Mar 2021, today" autocomplete="off" spellcheck="false"></div>'
    +   '<div class="parse" id="calParse"></div>'
    +   '<div class="cal-hd" id="calHd"></div>'
    +   '<div class="cal-body" id="calBody" tabindex="0"></div>'
    +   '<div class="dlg-ft"><div class="keys"><span class="kbd">&larr;&rarr;&uarr;&darr;</span> move <span class="kbd">PgUp</span><span class="kbd">PgDn</span> month <span class="kbd">T</span> today</div>'
    +     '<button class="ghost" id="calCancel">Cancel</button><button class="primary" id="calOk">Use this date</button></div>'
    + '</div></div>';
  document.body.appendChild(scrim);
  document.body.style.overflow = 'hidden';

  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) closeCal(); });
  $('calX').onclick = () => closeCal();
  $('calCancel').onclick = () => closeCal();
  $('calOk').onclick = () => { S.date = C.pick; closeCal(); render('date'); };
  $('quick').querySelectorAll('button').forEach((b) => {
    b.onclick = () => { C.pick = C.cursor = addDays(TODAY, +b.dataset.q); C.view = 'days'; renderCal('zm'); };
  });
  $('calType').addEventListener('input', onCalType);
  $('calType').addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); const d = parse(e.target.value); if (d && d <= TODAY) { C.pick = d; $('calOk').click(); } }
    if (e.key === 'Escape') closeCal();
  });
  $('calBody').addEventListener('keydown', onCalKey);
  renderCal();
  $('calBody').focus();
}

function closeCal() {
  const s = $('scrim');
  if (s) s.remove();
  document.body.style.overflow = '';
  if (C && C.back) C.back.focus();
  C = null;
}

function onCalType(e) {
  const out = $('calParse');
  const raw = e.target.value;
  const d = parse(raw);
  out.className = 'parse' + (!raw.trim() ? '' : d && d <= TODAY ? ' ok' : ' bad');
  if (!raw.trim()) { out.textContent = ''; return; }
  if (!d) { out.innerHTML = 'Can’t read that yet. Try <code>12/03/2021</code>'; return; }
  if (d > TODAY) { out.innerHTML = '<code>' + fmt(d) + '</code> is in the future'; return; }
  out.innerHTML = '↵ Enter to use <code>' + fmt(d) + '</code>';
  const moved = d.getMonth() !== C.cursor.getMonth() || d.getFullYear() !== C.cursor.getFullYear();
  const dir = d < C.cursor ? 'sr' : 'sl';
  C.pick = C.cursor = d; C.view = 'days';
  renderCal(moved ? dir : null);
}

function onCalKey(e) {
  if (e.key === 'Escape') { e.preventDefault(); if (C.view === 'days') closeCal(); else { C.view = 'days'; renderCal('zm'); } return; }
  if (/^[0-9]$/.test(e.key)) { e.preventDefault(); const i = $('calType'); i.focus(); i.value += e.key; onCalType({ target: i }); return; }
  if (C.view !== 'days') return;
  const c = C.cursor;
  let n;
  switch (e.key) {
    case 'ArrowLeft': n = addDays(c, -1); break;
    case 'ArrowRight': n = addDays(c, 1); break;
    case 'ArrowUp': n = addDays(c, -7); break;
    case 'ArrowDown': n = addDays(c, 7); break;
    case 'PageUp': n = addMonths(c, e.shiftKey ? -12 : -1); break;
    case 'PageDown': n = addMonths(c, e.shiftKey ? 12 : 1); break;
    case 't': case 'T': n = TODAY; break;
    case 'Enter': e.preventDefault(); C.pick = c; $('calOk').click(); return;
    default: return;
  }
  e.preventDefault();
  n = past(n);
  const moved = n.getMonth() !== c.getMonth() || n.getFullYear() !== c.getFullYear();
  C.cursor = C.pick = n;
  renderCal(moved ? (n < c ? 'sr' : 'sl') : null);
}

function renderCal(anim) {
  const { cursor, pick, view } = C;
  const y = cursor.getFullYear();
  const m = cursor.getMonth();

  $('bigDate').innerHTML = '<div class="d">' + pad(pick.getDate()) + '</div>'
    + '<div class="my">' + MON[pick.getMonth()] + ' ' + pick.getFullYear() + '</div>'
    + '<div class="wd">' + WD[pick.getDay()] + ' &middot; ' + ago(pick) + '</div>';
  $('asName').innerHTML = 'Goes into the name as<br><code>' + fmt(pick) + '</code>';
  $('quick').querySelectorAll('button').forEach((b) => {
    const d = addDays(TODAY, +b.dataset.q);
    b.innerHTML = b.textContent.replace(/\d{2}-\w{3}$/, '').trim() + '<span>' + pad(d.getDate()) + '-' + MON[d.getMonth()] + '</span>';
    b.classList.toggle('on', same(d, pick));
  });

  let title, atEnd;
  if (view === 'days') {
    title = '<button data-v="months">' + MONTH[m] + ICON.down + '</button><button class="yr" data-v="years">' + y + ICON.down + '</button>';
    atEnd = y === TODAY.getFullYear() && m === TODAY.getMonth();
  } else if (view === 'months') {
    title = '<button class="yr on" data-v="years">' + y + ICON.down + '</button>';
    atEnd = y >= TODAY.getFullYear();
  } else {
    const s = y - (y % 12);
    title = '<button class="yr on" data-v="days">' + s + ' &ndash; ' + (s + 11) + '</button>';
    atEnd = s + 11 >= TODAY.getFullYear();
  }
  $('calHd').innerHTML = '<div class="t">' + title + '</div>'
    + '<button class="calnav" data-s="-1" aria-label="Previous">' + ICON.left + '</button>'
    + '<button class="calnav" data-s="1" aria-label="Next"' + (atEnd ? ' disabled' : '') + '>' + ICON.right + '</button>';
  $('calHd').querySelectorAll('[data-v]').forEach((b) => { b.onclick = () => { C.view = b.dataset.v; renderCal('zm'); }; });
  $('calHd').querySelectorAll('[data-s]').forEach((b) => {
    b.onclick = () => {
      const s = +b.dataset.s;
      C.cursor = past(addMonths(C.cursor, s * { days: 1, months: 12, years: 144 }[C.view]));
      renderCal(s < 0 ? 'sr' : 'sl');
    };
  });

  let h = '';
  if (view === 'days') {
    h = '<div class="dow">' + ['Su', 'Mo', 'Tu', 'We', 'Th', 'Fr', 'Sa'].map((d) => '<span>' + d + '</span>').join('') + '</div><div class="days">';
    const first = mk(y, m, 1);
    let d = addDays(first, -first.getDay());
    for (let i = 0; i < 42; i++, d = addDays(d, 1)) {
      const cls = ['day'];
      if (d.getMonth() !== m) cls.push('other');
      if (d.getDay() === 0) cls.push('sun');
      if (same(d, TODAY)) cls.push('today');
      if (same(d, pick)) cls.push('sel');
      if (same(d, cursor)) cls.push('cursor');
      h += '<button tabindex="-1" class="' + cls.join(' ') + '" data-t="' + d.getTime() + '"' + (d > TODAY ? ' disabled' : '') + '>' + d.getDate() + '</button>';
    }
    h += '</div>';
  } else if (view === 'months') {
    h = '<div class="g12">' + MON.map((n, i) => '<button tabindex="-1" class="cell' + (pick.getFullYear() === y && pick.getMonth() === i ? ' sel' : TODAY.getFullYear() === y && TODAY.getMonth() === i ? ' now' : '')
      + '" data-m="' + i + '"' + (mk(y, i, 1) > TODAY ? ' disabled' : '') + '>' + n + '</button>').join('') + '</div>';
  } else {
    const s = y - (y % 12);
    h = '<div class="g12">' + Array.from({ length: 12 }, (_, i) => s + i).map((yy) => '<button tabindex="-1" class="cell yr'
      + (pick.getFullYear() === yy ? ' sel' : TODAY.getFullYear() === yy ? ' now' : '') + '" data-y="' + yy + '"'
      + (yy > TODAY.getFullYear() ? ' disabled' : '') + '>' + yy + '</button>').join('') + '</div>';
  }
  const body = $('calBody');
  body.innerHTML = h;
  if (anim) body.lastElementChild.classList.add(anim);
  body.querySelectorAll('.day:not(:disabled)').forEach((b) => {
    b.onclick = () => { C.pick = C.cursor = new Date(+b.dataset.t); renderCal(); };
    b.ondblclick = () => $('calOk').click();
  });
  body.querySelectorAll('[data-m]').forEach((b) => { b.onclick = () => { C.cursor = past(addMonths(cursor, +b.dataset.m - m)); C.view = 'days'; renderCal('zm'); }; });
  body.querySelectorAll('[data-y]').forEach((b) => { b.onclick = () => { C.cursor = past(addMonths(cursor, 12 * (+b.dataset.y - y))); C.view = 'months'; renderCal('zm'); }; });
  if (document.activeElement !== $('calType')) body.focus();
}

render();
</script>
</body>
</html>
